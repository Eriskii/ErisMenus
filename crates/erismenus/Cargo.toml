[package]
name = "erismenus"
description = "Installs and runs the daemon that loads ErisMenus into every app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
eris-inject = { git = "https://github.com/Eriskii/ErisMacInjectLib", tag = "v0.1.0" }
libc = "0.2"
